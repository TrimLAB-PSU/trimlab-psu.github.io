<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <!-- วิธีที่ 1: ใช้ Meta Tag ในการ Redirect ทันที (0 วินาที) -->
    <meta http-equiv="refresh" content="0; url=sigmath/">
    
    <!-- วิธีที่ 2: ใช้ JavaScript เป็นแผนสำรองเผื่อเบราว์เซอร์ปิดกั้น Meta Tag -->
    <script>
        window.location.href = "sigmath/";
    </script>
</head>
<body>
    <!-- ลิงก์สำรองเผื่อกรณีที่เบราว์เซอร์ของผู้ใช้ไม่ยอม Redirect อัตโนมัติ -->
    <p>กำลังเข้าสู่หน้าเว็บไซต์... หากระบบไม่เปลี่ยนหน้าอัตโนมัติ <a href="sigmath/">คลิกที่นี่</a></p>
</body>
</html>
